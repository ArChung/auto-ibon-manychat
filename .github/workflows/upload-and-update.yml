name: Upload to ibon & Update ManyChat

on:
  schedule:
    - cron: '0 1 */2 * *' # Every 2 days at UTC 01:00 (Taiwan 09:00)
  workflow_dispatch:
    inputs:
      pdf_path:
        description: 'Custom PDF path (relative to repo root)'
        required: false
        default: ''

jobs:
  upload-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run automation
        env:
          MANYCHAT_API_TOKEN: ${{ secrets.MANYCHAT_API_TOKEN }}
          PDF_PATH: ${{ github.event.inputs.pdf_path }}
        run: node src/main.js

      - name: Commit and push QR code
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f qrcode.png
          git diff --cached --quiet || git commit -m "update qrcode.png"
          git push

      - name: Upload error screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error-screenshot.png
          retention-days: 7
          if-no-files-found: ignore
